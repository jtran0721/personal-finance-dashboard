server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text assets.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # pdf.js ships an ES-module worker (.mjs). Some nginx builds don't map .mjs,
    # which makes the browser refuse to run it — force a valid JS MIME type.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Content-hashed build assets never change — cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Data API (the `api` compose service). Resolving through Docker's DNS at request
    # time lets nginx start even if the API isn't up yet, and survive its restarts.
    location /api/ {
        resolver             127.0.0.11 valid=10s;
        set $api             http://api:3001;
        proxy_pass           $api;
        client_max_body_size 20m;
        add_header Cache-Control "no-store";
    }

    # Client-side routing: serve index.html for any unmatched path so deep links
    # like /budget or /transactions work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry document (it references the hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
