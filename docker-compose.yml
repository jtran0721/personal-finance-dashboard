# FinTrack — self-hosting on a local server.
#   docker compose up -d --build      → http://localhost:8080
# Change the left-hand port (8080) to host it elsewhere.
services:
  fintrack:
    build: .
    image: fintrack:latest
    container_name: fintrack
    ports:
      - "8080:80"
    restart: unless-stopped
